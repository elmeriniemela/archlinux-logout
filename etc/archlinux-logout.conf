[settings]
opacity=80
icon_size=64
font_size=11
# buttons=cancel,logout,restart,shutdown,suspend,hibernate,lock
buttons=cancel,logout,restart,shutdown,suspend,lock

[commands]
logout=pkill awesome
lock=betterlockscreen -l dim -- --time-str="%H:%M"

# Overrides [commands] in Wayland sessions.
[commands-wayland]
lock=loginctl lock-session
logout=hyprctl dispatch 'hl.dsp.exit()'

# =======Themes=============

[themes]
theme=white


[binds]
lock=K
shutdown=S
restart=R
suspend=U
hibernate=H
logout=L
cancel=Escape
settings=P
